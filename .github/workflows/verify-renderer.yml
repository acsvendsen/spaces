name: Verify public renderer
on:
  workflow_dispatch:
permissions: {}
jobs:
  public-https:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify HTTPS from outside the home network
        shell: bash
        run: |
          set -euo pipefail
          result=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 https://render.spaces.proto.dk:8443/health)
          test "$result" = '{"ready": true}'
          for path in api/layout model/saved-layout.json jobs/aaaaaaaaaaaaaaaaaaaaaaaa images/aaaaaaaaaaaaaaaaaaaaaaaa; do
            status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' "https://render.spaces.proto.dk:8443/$path")
            test "$status" = 404
          done
          for path in projects accounts/backup projects/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee; do
            status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' "https://render.spaces.proto.dk:8443/$path")
            test "$status" = 401
          done
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{}' https://render.spaces.proto.dk:8443/render)
          test "$status" = 401
          echo 'Public HTTPS ready; private account projects, owner routes and unauthorised results blocked.'  
